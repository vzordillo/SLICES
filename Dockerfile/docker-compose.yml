version: '3.8'

services:
  workq:
    image: umat:v2
    container_name: workq
    hostname: workq
    ports:
      - "8880:8880"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all  # Use all GPUs
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility  # Enable compute and utility driver capabilities
    volumes:
      - ${SLICES_DATA_DIR:-..}:/crystal
      - ${SLICES_DOCKER_DIR:-.}:/mnt
    runtime: nvidia  # Enable GPU support
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: /mnt/entrypoint_set_cpus_jupyter.sh

