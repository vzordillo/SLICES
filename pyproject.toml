[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slices"
version = "4.1.0"
description = "Invertible crystal representation (SLICES) for inverse materials design"
authors = [{name = "Hang Xiao", email = "xiaohang07@live.cn"}]
requires-python = ">=3.10"
license-files = ["LICENSE", "src/slices/_vendor/gfnff_extra/LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "networkx",
    "sympy",
    "pymatgen",
    "scikit-learn",
    "tqdm",
    "ase",
    # PyTorch + NequIP force fields for relax_model="auto". Pick the torch build with one of
    # the extras below: uv sync --extra cpu | cu126 | cu128
    "torch>=2.6,<2.10",   # 2.6+ for AOTInductor export; 2.9 is the tested version
    "nequip==0.17.1",
    "matscipy>=1.0.0",
]

[project.scripts]
slices = "slices.cli:main"

[project.urls]
Homepage = "https://github.com/xiaohang007/SLICES"

[project.optional-dependencies]
cpu = ["torch>=2.6,<2.10"]
cu126 = ["torch>=2.6,<2.10"]   # NVIDIA GPUs up to the RTX 40 series
cu128 = ["torch>=2.6,<2.10"]   # also needed for RTX 50 series
oeq = ["openequivariance"]     # optional faster NequIP kernels on NVIDIA GPUs

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
]

# Tsinghua PyPI mirror as the default index, so uv.lock resolves the same everywhere without
# extra settings. Users outside China can set UV_DEFAULT_INDEX=https://pypi.org/simple (uv then
# re-resolves; use `uv sync --locked` to keep exactly the locked versions from the mirror).
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.package-data]
slices = [
    "nlopt.h",
    "_vendor/gfnff/libgfnff.so*",
    "_vendor/gfnff.libs/*",
    "_vendor/gfnff_extra/*",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "src/slices/_vendor",
    "HTS",
    "benchmark",
    "data",
    "docs",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
    "D",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# DEF-005 (RUL-03): Frozen top-of-file environment/warning setup before scientific imports.
"src/slices/core.py" = ["E402"]
# Frozen single-line 250-entry space-group Wyckoff encoding literal.
"src/slices/utils_wyckoff.py" = ["E501"]
# Standalone benchmark script sets OMP_NUM_THREADS=1 before importing NumPy/Pymatgen.
"examples/3.benchmark_relax_models.py" = ["E402"]
# Allow long SLICES/mock literals, concise test functions, raw Exception checks, and legacy noqa tags.
"tests/**/*.py" = ["B017", "D100", "D101", "D102", "D103", "D104", "D107", "E501", "RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = [
    ".git",
    ".venv",
    "build",
    "dist",
    "src/slices/_vendor",
    "HTS",
    "benchmark",
    "data",
    "docs",
]
markers = [
    "baseline: Golden baseline equivalence tests against upstream SLICES v4.0.2",
    "unit: Fast unit tests for individual modules and functions",
    "integration: End-to-end integration workflow tests",
    "regression: Regression tests for API compatibility and known structures",
    "slow: Slow-running tests",
    "mlip: Optional external MLIP backend tests (chgnet, mattersim, orbv3, mace, m3gnet)",
    "gfnff: GFN-FF topology and cross-platform helper tests",
    "network: Tests requiring external network access",
]
