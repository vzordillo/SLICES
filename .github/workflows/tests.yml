# GitHub Actions CI/CD workflow
# Automatically runs tests on push/PR to main branch
# Tests against Python 3.9, 3.10, 3.11
# 
# To disable: delete this file or set 'on:' to empty
# To modify: edit the python-version matrix or test commands

name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10"]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        pip install -e ".[dev]"
    
    - name: Run tests
      run: |
        pytest tests/ -v
